name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      # dist/ sürüm kontrolünde tutulur; src ile uyumsuzsa (build unutulmuşsa) hata ver
      - name: dist/ güncel mi?
        run: git diff --exit-code -- dist ':!dist/*.map'
