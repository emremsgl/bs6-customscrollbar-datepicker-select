name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/bs6-custom-ui.min.js dist/bs6-custom-ui.min.css dist/bs6-custom-ui.esm.min.js \
            --title "$GITHUB_REF_NAME" --generate-notes
      # npm'e yayınlamak isterseniz NPM_TOKEN secret'ı ekleyip şunu açın:
      # - run: npm publish --provenance --access public
      #   env:
      #     NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
