name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FILES="dist/bs6-custom-ui.min.js dist/bs6-custom-ui.min.css dist/bs6-custom-ui.esm.min.js"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            # Etiket taşındıysa (yeniden yayın) var olan Release'in dosyalarını güncelle
            gh release upload "$GITHUB_REF_NAME" $FILES --clobber
          else
            gh release create "$GITHUB_REF_NAME" $FILES --title "$GITHUB_REF_NAME" --generate-notes
          fi
      # npm'e yayınlamak isterseniz NPM_TOKEN secret'ı ekleyip şunu açın:
      # - run: npm publish --provenance --access public
      #   env:
      #     NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
