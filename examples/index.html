<!DOCTYPE html>
<html lang="tr" data-bs-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>bs6-custom-ui — örnekler</title>

  <!-- 1) Bootstrap 6 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css">
  <!-- 2) bs6-custom-ui: tek CSS -->
  <link rel="stylesheet" href="../dist/bs6-custom-ui.min.css">
  <style>.g3 { display: grid; gap: 1rem; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }</style>
</head>
<body class="p-4">
  <svg xmlns="http://www.w3.org/2000/svg" style="display:none">
    <symbol id="i-cal" viewBox="0 0 16 16"><path fill="currentColor" d="M3.5 0a.5.5 0 0 1 .5.5V1h8V.5a.5.5 0 0 1 1 0V1h1a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2V3a2 2 0 0 1 2-2h1V.5a.5.5 0 0 1 .5-.5M1 4v10a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V4z"/></symbol>
    <symbol id="i-pin" viewBox="0 0 16 16"><path fill="currentColor" d="M8 16s6-5.686 6-10A6 6 0 0 0 2 6c0 4.314 6 10 6 10m0-7a3 3 0 1 1 0-6 3 3 0 0 1 0 6"/></symbol>
  </svg>

  <div class="container" style="max-width: 980px">
    <div class="d-flex flex-wrap gap-2 mb-4 align-items-center">
      <h1 class="h4 m-0 me-auto">bs6-custom-ui</h1>
      <button class="btn" type="button" id="tLight">Açık</button>
      <button class="btn" type="button" id="tDark">Koyu</button>
      <button class="btn" type="button" data-bs-toggle="dialog" data-bs-target="#dlg">Dialog aç</button>
    </div>

    <h2 class="h6 text-uppercase fg-2">Hızlı başlangıç: yalnızca data-bs-ui</h2>
    <div class="g3 mb-4">
      <div>
        <label for="q1" class="form-label">Select</label>
        <select id="q1" class="form-control" data-bs-ui>
          <option value="">Şehir seçin</option>
          <option>Ankara</option><option>Bursa</option><option>İstanbul</option>
          <option>İzmir</option>
          <option>Denizli</option>
          <option>Manisa</option>
          <option>Kastamonu</option>
          <option>İzmir</option><option>Konya</option>
        </select>
      </div>
      <div>
        <label for="q2" class="form-label">Çoklu select (tek satır + "+N")</label>
        <select id="q2" class="form-control" multiple data-bs-ui data-clearable="true">
          <option selected>Ankara</option><option selected>Bursa</option><option selected>İstanbul</option><option selected>İzmir</option><option>Konya</option>
        </select>
      </div>
      <div>
        <label for="q3" class="form-label">Tarih</label>
        <input id="q3" class="form-control" type="text" data-bs-ui>
      </div>
      <div>
        <label for="q4" class="form-label">Tarih aralığı</label>
        <input id="q4" class="form-control" type="text" data-bs-ui data-cdp-mode="range">
      </div>
    </div>

    <h2 class="h6 text-uppercase fg-2">form-floating</h2>
    <div class="g3 mb-4">
      <div class="form-floating">
        <label for="f1">Şehir</label>
        <select id="f1" class="form-control" data-bs-ui><option value="">Şehir seçin</option><option>Ankara</option><option>Bursa</option><option>İzmir</option></select>
      </div>
      <div class="form-floating">
        <label for="f2">Şehirler (çoklu)</label>
        <select id="f2" class="form-control" multiple data-bs-ui><option selected>Ankara</option><option selected>Bursa</option><option>İzmir</option></select>
      </div>
      <div class="form-floating">
        <label for="f3">Doğum tarihi</label>
        <input id="f3" class="form-control" type="text" data-bs-ui>
      </div>
    </div>

    <h2 class="h6 text-uppercase fg-2">form-adorn</h2>
    <div class="g3 mb-4">
      <div>
        <label for="a1" class="form-label">Şehir</label>
        <label class="form-control form-adorn">
          <span class="form-adorn-icon" aria-hidden="true"><svg width="16" height="16"><use href="#i-pin"/></svg></span>
          <select id="a1" class="form-ghost" data-bs-ui><option>Ankara</option><option>Bursa</option><option>İzmir</option></select>
        </label>
      </div>
      <div>
        <label for="a2" class="form-label">Tarih</label>
        <label class="form-control form-adorn">
          <span class="form-adorn-icon" aria-hidden="true"><svg width="16" height="16"><use href="#i-cal"/></svg></span>
          <input id="a2" class="form-ghost" type="text" data-bs-ui>
        </label>
      </div>
    </div>

    <h2 class="h6 text-uppercase fg-2">Doğrulama</h2>
    <div class="g3 mb-4">
      <div>
        <label for="v1" class="form-label">Geçerli</label>
        <select id="v1" class="form-control is-valid" data-bs-ui><option>Bursa</option><option>İzmir</option></select>
        <div class="valid-feedback">Harika görünüyor.</div>
      </div>
      <div>
        <label for="v2" class="form-label">Hatalı</label>
        <select id="v2" class="form-control is-invalid" required data-bs-ui><option value="">Şehir seçin</option><option>İzmir</option></select>
        <div class="invalid-feedback">Lütfen bir değer seçin.</div>
      </div>
    </div>

    <h2 class="h6 text-uppercase fg-2">Kaydırma çubuğu (yalnız başına)</h2>
    <div id="sc" class="border rounded p-2 mb-4" style="max-height:110px;overflow:auto" data-bs-ui="scrollbar"></div>

    <h2 class="h6 text-uppercase fg-2">Dinamik ekleme (otomatik algılanır)</h2>
    <div class="d-flex gap-2 mb-2">
      <button type="button" class="btn" id="addSel">Yeni select ekle</button>
    </div>
    <div id="dyn" class="g3"></div>
  </div>

  <dialog class="dialog" id="dlg" aria-labelledby="dlgTitle">
    <div class="dialog-header"><h2 class="dialog-title" id="dlgTitle">Dialog içinde</h2></div>
    <div class="dialog-body">
      <div class="form-floating mb-3">
        <label for="d1">Şehir</label>
        <select id="d1" class="form-control" data-bs-ui><option value="">Şehir seçin</option><option>Ankara</option><option>Bursa</option><option>İzmir</option></select>
      </div>
      <label for="d2" class="form-label">Tarih</label>
      <input id="d2" class="form-control" type="text" data-bs-ui>
    </div>
    <div class="dialog-footer"><button class="btn" data-bs-dismiss="dialog" type="button">Kapat</button></div>
  </dialog>

  <!-- Bootstrap 6 (ES modülü; window.bootstrap yok) -->
  <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js"></script>
  <!-- bs6-custom-ui: tek JS. data-bs-ui öğeleri sayfa yüklenince kendiliğinden başlar. -->
  <script src="../dist/bs6-custom-ui.min.js"></script>
  <script>
    // Aşağısı yalnızca demo içindir; bileşenlerin çalışması için gerekmez.
    var sc = document.getElementById('sc');
    for (var i = 1; i <= 30; i++) { var p = document.createElement('div'); p.textContent = 'Satır ' + i; sc.appendChild(p); }

    var n = 0;
    document.getElementById('addSel').onclick = function () {
      n++;
      var d = document.createElement('div');
      d.innerHTML = '<label class="form-label" for="dy' + n + '">Dinamik ' + n + '</label>' +
        '<select id="dy' + n + '" class="form-control" data-bs-ui><option>Bir</option><option>İki</option><option>Üç</option></select>';
      document.getElementById('dyn').appendChild(d);   // BS6UI.observe sayesinde otomatik başlar
    };

    document.getElementById('tLight').onclick = function () { document.documentElement.setAttribute('data-bs-theme', 'light'); };
    document.getElementById('tDark').onclick = function () { document.documentElement.setAttribute('data-bs-theme', 'dark'); };
  </script>
</body>
</html>
